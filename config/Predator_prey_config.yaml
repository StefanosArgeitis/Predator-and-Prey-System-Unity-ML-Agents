behaviors:
  Predator:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 1024
    summary_freq: 10000
    keep_checkpoints: 10
    self_play:
      save_steps: 20000
      swap_steps: 10000
      team_change: 100000
      window: 10
      play_against_latest_model_ratio: 0.5

